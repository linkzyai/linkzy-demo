<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<style>body{font:17px/1.6 system-ui,sans-serif;max-width:680px;margin:40px auto;padding:0 16px;color:#1c1c1c}a{color:#c2410c}header{margin-bottom:32px}small{color:#666}</style>
</head>
<body>
<header><a href="/"><strong>{{ site.title }}</strong></a><br><small>A test site. These sample posts exist only to test Linkzy.</small></header>
<main>
{% if page.layout == "post" %}<h1>{{ page.title }}</h1>{% endif %}
{{ content }}
</main>
</body>
</html>
